title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/fixtures/.*''',
  '''node_modules''',
  '''out''',
  '''dist''',
  '''.*\.log$''',
  '''package-lock\.json$''',
]
regexes = [
  # VS Code API references that look like credentials
  '''vscode\.(SecretStorage|secrets)''',
  # Example connection strings in docs/tests
  '''quic://[a-zA-Z]+:[a-zA-Z]+@localhost''',
]
stopwords = [
  "test",
  "mock",
  "example",
]
