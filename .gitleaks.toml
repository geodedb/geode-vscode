title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/.*''',
  '''node_modules''',
  '''out''',
  '''.*\.ts$''',
  '''.*\.js$''',
  '''.*\.md$''',
  '''.*\.log$''',
]
