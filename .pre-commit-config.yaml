# Pre-commit configuration for Geode VS Code Extension
# https://pre-commit.com/
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

default_stages: [pre-commit]
fail_fast: false

repos:
  # =============================================================================
  # Standard pre-commit hooks (best practices)
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(node_modules/|out/|dist/)
      - id: end-of-file-fixer
        exclude: ^(node_modules/|out/|dist/|.*\.vsix$)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(node_modules/|out/|dist/)

      # Syntax validation
      - id: check-yaml
        args: [--unsafe]
        exclude: ^(node_modules/)
      - id: check-json
        exclude: ^(node_modules/)
      - id: check-toml

      # Security
      - id: detect-private-key
        exclude: ^(certs/|test.*certs/)
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^(node_modules/)

      # Git hygiene
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

  # =============================================================================
  # Markdown linting
  # =============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041, MD024, --]
        exclude: ^(node_modules/|CHANGELOG\.md)

  # =============================================================================
  # Commit message validation (Conventional Commits)
  # =============================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # =============================================================================
  # Local/Custom hooks for TypeScript and Version Verification
  # =============================================================================
  - repo: local
    hooks:
      # TypeScript compilation check
      - id: tsc-check
        name: TypeScript compile
        entry: npm run compile
        language: system
        files: \.ts$
        exclude: ^(node_modules/)
        pass_filenames: false

      # ESLint check
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        files: \.ts$
        exclude: ^(node_modules/)
        pass_filenames: false

      # Unit tests (on push only - may be slow)
      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        files: \.ts$
        exclude: ^(node_modules/)
        pass_filenames: false
        stages: [pre-push]

      # Version tag verification (on push only)
      - id: version-tag-check
        name: version matches git tag
        entry: scripts/verify-version.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

      # Check for TODO/FIXME in committed code (warning only)
      - id: check-todos
        name: check for TODOs/FIXMEs
        entry: bash
        args:
          - -c
          - |
            git diff --cached --name-only | xargs grep -l -E "(TODO|FIXME|XXX|HACK)" 2>/dev/null && echo "Warning: Found TODO/FIXME markers in staged files" && exit 0 || exit 0
        language: system
        pass_filenames: false
        verbose: true

# =============================================================================
# CI configuration
# =============================================================================
ci:
  autofix_prs: true
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    For more info see https://pre-commit.ci
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [tsc-check, eslint, npm-test, version-tag-check]
  submodules: false
