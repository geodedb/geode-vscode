include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@latest

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@latest

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@latest
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@latest
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release

build:
  stage: build
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run package
    - ls -la *.vsix
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

lint:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run lint || true
  rules:
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run test || true
  rules:
    - if: '$CI_COMMIT_BRANCH'
