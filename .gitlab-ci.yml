# SECURITY: Issue #37 - Pin component versions instead of using @latest
# This prevents supply chain attacks via malicious updates
include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@1.0.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@1.0.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@1.0.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@1.0.0

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@1.0.0

  # SECURITY: Issue #38 - Make SBOM scan blocking to enforce security policy
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@1.0.0
    inputs:
      allow_failure: false

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@1.0.0
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release

# SECURITY: Issue #37 - Use image digests for reproducible builds
# NOTE: Update these digests periodically from official Node.js images
# Get digest with: docker pull node:20-alpine && docker inspect --format='{{.RepoDigests}}' node:20-alpine
build:
  stage: build
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run package
    - ls -la *.vsix
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

lint:
  stage: test
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run test
  rules:
    - if: '$CI_COMMIT_BRANCH'
