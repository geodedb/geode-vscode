# SECURITY: Issue #37 - Pin component versions instead of using @latest
# This prevents supply chain attacks via malicious updates
include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.9.15

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.9.15

  # SECURITY: Issue #38 - Make SBOM scan blocking to enforce security policy
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.9.15
    inputs:
      allow_failure: false

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.9.15
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - package
  - publish
  - release

# SECURITY: Issue #37 - Use image digests for reproducible builds
# NOTE: Update these digests periodically from official Node.js images
# Get digest with: docker pull node:20-alpine && docker inspect --format='{{.RepoDigests}}' node:20-alpine
#
# Branch builds compile the TypeScript and ship the transpiled tree as an
# artifact for downstream lint/test. They do NOT run `npm run package` —
# packaging requires `prepackage` to fetch the geode-ui SPA + bundled
# binaries (either from a sibling working copy in dev or from the GitLab
# Generic Package Registry in CI). Per-platform packaging happens on tag
# pipelines via the `package:<slug>` matrix below.
build:
  stage: build
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
  artifacts:
    paths:
      - out/
      - node_modules/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

lint:
  stage: test
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  needs: [build]
  script:
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  needs: [build]
  script:
    - npm run test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# Per-platform VSIX packaging (registry mode)
# =============================================================================
# These jobs download pre-built binaries from the registry, then produce a
# platform-specific .vsix using vsce --target.  They only run on tags so that
# branch pipelines skip the binary download overhead.
.package-base: &package-base
  stage: package
  image: node:20
  needs:
    - job: lint
    - job: test
  before_script:
    - npm ci
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
      when: on_success
    - when: never

package:linux-x64:
  <<: *package-base
  script:
    - node scripts/fetch-geode-ui.mjs --source=registry --version="${SPA_VERSION}"
    - node scripts/fetch-geode-binaries.mjs --source=registry --uiVersion="${UI_BIN_VERSION}" --geodeVersion="${DB_BIN_VERSION}" --targetPlatform=linux-x64
    - npm run compile
    - npx vsce package --target linux-x64 --skip-license --out geode-vscode-${CI_COMMIT_TAG}-linux-x64.vsix

package:linux-arm64:
  <<: *package-base
  script:
    - node scripts/fetch-geode-ui.mjs --source=registry --version="${SPA_VERSION}"
    - node scripts/fetch-geode-binaries.mjs --source=registry --uiVersion="${UI_BIN_VERSION}" --geodeVersion="${DB_BIN_VERSION}" --targetPlatform=linux-arm64
    - npm run compile
    - npx vsce package --target linux-arm64 --skip-license --out geode-vscode-${CI_COMMIT_TAG}-linux-arm64.vsix

package:darwin-x64:
  <<: *package-base
  script:
    - node scripts/fetch-geode-ui.mjs --source=registry --version="${SPA_VERSION}"
    - node scripts/fetch-geode-binaries.mjs --source=registry --uiVersion="${UI_BIN_VERSION}" --geodeVersion="${DB_BIN_VERSION}" --targetPlatform=darwin-x64
    - npm run compile
    - npx vsce package --target darwin-x64 --skip-license --out geode-vscode-${CI_COMMIT_TAG}-darwin-x64.vsix

package:darwin-arm64:
  <<: *package-base
  script:
    - node scripts/fetch-geode-ui.mjs --source=registry --version="${SPA_VERSION}"
    - node scripts/fetch-geode-binaries.mjs --source=registry --uiVersion="${UI_BIN_VERSION}" --geodeVersion="${DB_BIN_VERSION}" --targetPlatform=darwin-arm64
    - npm run compile
    - npx vsce package --target darwin-arm64 --skip-license --out geode-vscode-${CI_COMMIT_TAG}-darwin-arm64.vsix

package:win32-x64:
  <<: *package-base
  script:
    - node scripts/fetch-geode-ui.mjs --source=registry --version="${SPA_VERSION}"
    - node scripts/fetch-geode-binaries.mjs --source=registry --uiVersion="${UI_BIN_VERSION}" --geodeVersion="${DB_BIN_VERSION}" --targetPlatform=win32-x64
    - npm run compile
    - npx vsce package --target win32-x64 --skip-license --out geode-vscode-${CI_COMMIT_TAG}-win32-x64.vsix

# =============================================================================
# Publish to VS Code Marketplace
# =============================================================================
# Retrieves VSCE PAT from Vault at devnw/geode/vsce (field: pat).
# Uses script-based JWT auth matching the ci-catalog vault-auth pattern.
#
# Tag pipelines only. Pulls the per-platform VSIX artifacts produced by
# `package:<slug>` matrix jobs and publishes each one — vsce publishes
# platform-specific extensions by inspecting the embedded `targetPlatform`
# field in the package metadata.
publish-marketplace:
  stage: publish
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  needs:
    - job: package:linux-x64
      artifacts: true
    - job: package:linux-arm64
      artifacts: true
    - job: package:darwin-x64
      artifacts: true
    - job: package:darwin-arm64
      artifacts: true
    - job: package:win32-x64
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://pki.devnw.com
  variables:
    VAULT_ADDR: https://pki.devnw.com
    VAULT_AUTH_ROLE: codepros-ci
    VAULT_MOUNT: devnw
    VAULT_SECRET_PATH: geode/vsce
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail

      # Authenticate to Vault via JWT
      echo "Authenticating to Vault at $VAULT_ADDR with role $VAULT_AUTH_ROLE"
      AUTH_RESPONSE=$(curl -sS --request POST \
        --data "{\"role\": \"$VAULT_AUTH_ROLE\", \"jwt\": \"$VAULT_ID_TOKEN\"}" \
        "$VAULT_ADDR/v1/auth/gitlab-jwt/login")
      VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token')

      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
        echo "ERROR: Failed to authenticate to Vault"
        echo "Response: $AUTH_RESPONSE"
        exit 1
      fi
      echo "Vault authentication successful"

      # Retrieve VSCE PAT from Vault
      echo "Retrieving VSCE PAT from Vault..."
      VSCE_PAT=$(curl -sS --header "X-Vault-Token: $VAULT_TOKEN" \
        "$VAULT_ADDR/v1/${VAULT_MOUNT}/data/$VAULT_SECRET_PATH" | jq -r '.data.data.pat // empty')

      if [ -z "$VSCE_PAT" ]; then
        echo "ERROR: VSCE PAT not found in Vault at $VAULT_SECRET_PATH (field: pat)"
        exit 1
      fi
      echo "VSCE PAT retrieved successfully"

      # Publish each per-platform VSIX to the VS Code Marketplace.
      shopt -s nullglob
      published=0
      for vsix in *.vsix; do
        echo "Publishing ${vsix}..."
        npx vsce publish --packagePath "${vsix}" --skip-license -p "$VSCE_PAT"
        published=$((published + 1))
      done
      if [ "$published" -eq 0 ]; then
        echo "ERROR: no VSIX artifacts found to publish"
        exit 1
      fi
      echo "Published ${published} VSIX file(s) to Marketplace"
  environment:
    name: vscode-marketplace
    url: https://marketplace.visualstudio.com/items?itemName=codeprosorg.geode-vscode
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
      when: on_success
    - when: never

# =============================================================================
# Publish to Open VSX Registry
# =============================================================================
# Retrieves Open VSX PAT from Vault at devnw/geode/openvsx (field: pat).
# Uses script-based JWT auth matching the ci-catalog vault-auth pattern.
publish-openvsx:
  stage: publish
  image: node:20-alpine@sha256:2d5e8a8a51bc341fd5f2eed6d91455c3a3d147e91a14298fc564b5dc519c1666
  needs:
    - job: package:linux-x64
      artifacts: true
    - job: package:linux-arm64
      artifacts: true
    - job: package:darwin-x64
      artifacts: true
    - job: package:darwin-arm64
      artifacts: true
    - job: package:win32-x64
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://pki.devnw.com
  variables:
    VAULT_ADDR: https://pki.devnw.com
    VAULT_AUTH_ROLE: codepros-ci
    VAULT_MOUNT: devnw
    VAULT_SECRET_PATH: geode/openvsx
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail

      # Authenticate to Vault via JWT
      echo "Authenticating to Vault at $VAULT_ADDR with role $VAULT_AUTH_ROLE"
      AUTH_RESPONSE=$(curl -sS --request POST \
        --data "{\"role\": \"$VAULT_AUTH_ROLE\", \"jwt\": \"$VAULT_ID_TOKEN\"}" \
        "$VAULT_ADDR/v1/auth/gitlab-jwt/login")
      VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token')

      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
        echo "ERROR: Failed to authenticate to Vault"
        echo "Response: $AUTH_RESPONSE"
        exit 1
      fi
      echo "Vault authentication successful"

      # Retrieve Open VSX PAT from Vault
      echo "Retrieving Open VSX PAT from Vault..."
      OVSX_PAT=$(curl -sS --header "X-Vault-Token: $VAULT_TOKEN" \
        "$VAULT_ADDR/v1/${VAULT_MOUNT}/data/$VAULT_SECRET_PATH" | jq -r '.data.data.pat // empty')

      if [ -z "$OVSX_PAT" ]; then
        echo "ERROR: Open VSX PAT not found in Vault at $VAULT_SECRET_PATH (field: pat)"
        exit 1
      fi
      echo "Open VSX PAT retrieved successfully"

      # Ensure publisher namespace exists (idempotent)
      npx ovsx create-namespace codeprosorg -p "$OVSX_PAT" || true

      # Publish each per-platform VSIX to Open VSX.
      shopt -s nullglob
      published=0
      for vsix in *.vsix; do
        echo "Publishing ${vsix}..."
        npx ovsx publish "${vsix}" -p "$OVSX_PAT"
        published=$((published + 1))
      done
      if [ "$published" -eq 0 ]; then
        echo "ERROR: no VSIX artifacts found to publish"
        exit 1
      fi
      echo "Published ${published} VSIX file(s) to Open VSX"
  environment:
    name: open-vsx
    url: https://open-vsx.org/extension/codeprosorg/geode-vscode
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
      when: on_success
    - when: never

# Upload each per-platform .vsix to the GitLab Generic Package Registry as a
# durable artifact alongside the GitLab Release page.
publish-gitlab:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: package:linux-x64
      artifacts: true
    - job: package:linux-arm64
      artifacts: true
    - job: package:darwin-x64
      artifacts: true
    - job: package:darwin-arm64
      artifacts: true
    - job: package:win32-x64
      artifacts: true
  script:
    - |
      set -eu
      uploaded=0
      for vsix in *.vsix; do
        [ -f "${vsix}" ] || continue
        echo "Uploading ${vsix} to GitLab Package Registry..."
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${vsix}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/geode-vscode/${CI_COMMIT_TAG}/${vsix}"
        uploaded=$((uploaded + 1))
      done
      if [ "$uploaded" -eq 0 ]; then
        echo "ERROR: no VSIX artifacts found to upload"
        exit 1
      fi
      echo "Uploaded ${uploaded} VSIX file(s)"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
      when: on_success
    - when: never

# Release must wait for publish to complete
create-release:
  needs:
    - job: publish-marketplace
      optional: false
    - job: publish-openvsx
      optional: false
    - job: publish-gitlab
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
      when: on_success
    - when: never
