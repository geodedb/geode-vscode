stages:
  - build
  - test
  - security

build:
  stage: build
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run package
    - ls -la *.vsix
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

lint:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run lint || true
  rules:
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache make git
  script:
    - npm ci
    - npm run compile
    - npm run test || true
  rules:
    - if: '$CI_COMMIT_BRANCH'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: security

secret_detection:
  stage: security
